<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gombe Online Market · Seller Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f4f7fc;
      color: #0a2540;
      line-height: 1.5;
    }

    /* announcement bar */
    .announcement-bar {
      background: linear-gradient(135deg, #0a1f2e, #03111c);
      color: white;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px solid #f97316;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .announcement-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .announcement-content i {
      color: #f97316;
      font-size: 1.2rem;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .announcement-edit {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(249,115,22,0.5);
      color: #ffd7b5;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.2s;
    }
    .announcement-edit:hover {
      background: #f97316;
      color: white;
      border-color: #f97316;
    }

    .dashboard {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      z-index: 998;
    }
    .sidebar-overlay.show { display: block; }

    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0b2b3b 0%, #05161f 100%);
      color: #e0f0fa;
      position: fixed;
      top: 56px;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      z-index: 999;
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .sidebar-logo-area {
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(120deg, #f97316, #ffae70);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sidebar-user-area {
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-avatar {
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, #f97316, #c2410c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 1.9rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(249,115,22,0.4);
      border: 2px solid rgba(255,255,255,0.3);
    }
    .sidebar-username {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .sidebar-role {
      font-size: 0.7rem;
      background: rgba(249,115,22,0.25);
      display: inline-block;
      padding: 4px 10px;
      border-radius: 60px;
      margin-top: 8px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      color: #cbdde9;
      cursor: pointer;
      border-radius: 16px;
      font-weight: 500;
      font-size: 0.9rem;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.2s;
    }
    .nav-link:hover {
      background: rgba(249,115,22,0.2);
      color: white;
      transform: translateX(4px);
    }
    .nav-link.active {
      background: linear-gradient(90deg, rgba(249,115,22,0.3), transparent);
      color: #f97316;
      font-weight: 600;
      border-left: 3px solid #f97316;
    }
    .nav-link i { width: 24px; }
    .nav-link .badge {
      margin-left: auto;
      background: #f97316;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 40px;
    }
    .logout-sidebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #f87171;
      cursor: pointer;
      border-radius: 16px;
      font-weight: 500;
      width: 100%;
      background: none;
      border: none;
    }
    .logout-sidebar:hover {
      background: rgba(239,68,68,0.15);
    }
    .main-content {
      flex: 1;
      margin-left: 0;
      padding: 28px 28px;
      transition: margin 0.3s;
    }
    .top-bar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 16px 28px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 8px 20px -8px rgba(0,0,0,0.05), 0 0 0 1px rgba(249,115,22,0.1);
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .menu-btn {
      font-size: 1.3rem;
      background: #fff0e6;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 20px;
      cursor: pointer;
      color: #f97316;
    }
    .page-title-area h1 {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0f2b3d, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .btn-logout {
      background: #fee9e6;
      color: #f97316;
      border: 1px solid #ffd9ce;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 32px;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.02), 0 0 0 1px #edf2f7;
      transition: all 0.25s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1);
      border-color: #f9731640;
    }
    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 24px;
      background: #fff5ed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      color: #f97316;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
    }
    .wallet-card {
      background: linear-gradient(115deg, #f97316, #ea580c, #b91c0c);
      border-radius: 36px;
      padding: 26px 34px;
      margin-bottom: 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      color: white;
      box-shadow: 0 20px 35px -12px rgba(249,115,22,0.5);
    }
    .wallet-balance {
      font-size: 2.3rem;
      font-weight: 800;
      margin: 6px 0 6px;
    }
    .wallet-account {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
      padding: 5px 16px;
      border-radius: 60px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .section-card {
      background: white;
      border-radius: 36px;
      padding: 28px;
      margin-bottom: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
      border: 1px solid #ecf3f9;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }
    .service-card {
      background: #fefaf7;
      border-radius: 28px;
      padding: 20px;
      text-align: center;
      border: 1px solid #ffe4d4;
      transition: 0.2s;
    }
    .service-card i {
      font-size: 2rem;
      color: #f97316;
      margin-bottom: 12px;
    }
    .list-item {
      background: #ffffff;
      border-radius: 24px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      border: 1px solid #edf2f8;
      transition: 0.2s;
    }
    .list-item-thumb {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .list-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-badge {
      padding: 5px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #b45309; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .btn-primary {
      background: #f97316;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(249,115,22,0.3);
      transition: all 0.2s;
    }
    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: 0.1s;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 1200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 40px;
      padding: 32px;
      max-width: 540px;
      width: 90%;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2edf2;
      border-radius: 20px;
      font-family: inherit;
    }
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1300;
    }
    .toast {
      background: #1f2a3e;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      margin-top: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    @media (min-width: 1024px) {
      .sidebar { transform: translateX(0); position: sticky; top: 56px; }
      .main-content { margin-left: 280px; }
      .menu-btn { display: none; }
    }
    .image-preview-modal .modal { background: rgba(0,0,0,0.85); padding: 0; max-width: 85vw; text-align: center; }
    .image-preview-modal img { max-width: 85vw; max-height: 80vh; border-radius: 20px; }
  </style>
</head>
<body>

<div class="announcement-bar" id="announcementBar">
  <div class="announcement-content"><i class="fas fa-bullhorn"></i><span id="announcementText">Loading announcement...</span></div>
  <button class="announcement-edit" id="editAnnouncementBtn"><i class="fas fa-pen"></i> Admin edit</button>
</div>

<div class="dashboard">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo-area"><div class="sidebar-logo">GOMBE<span style="color:#f97316">MARKET</span></div></div>
    <div class="sidebar-user-area"><div class="sidebar-avatar" id="userAvatarLarge">U</div><div class="sidebar-username" id="sidebarUserName">Seller</div><div class="sidebar-role">⭐ Verified Merchant</div></div>
    <nav class="sidebar-nav">
      <button class="nav-link active" data-page="overview"><i class="fas fa-chart-line"></i> Dashboard</button>
      <button class="nav-link" data-page="orders"><i class="fas fa-shopping-bag"></i> My Orders <span class="badge" id="pendingBadge">0</span></button>
      <button class="nav-link" data-page="transactions"><i class="fas fa-arrow-right-arrow-left"></i> Transactions</button>
      <button class="nav-link" data-page="sell"><i class="fas fa-plus-circle"></i> Sell Product</button>
      <button class="nav-link" data-page="my-products"><i class="fas fa-store"></i> My Listings</button>
      <button class="nav-link" data-page="kyc"><i class="fas fa-id-card"></i> KYC Verification</button>
      <button class="nav-link" data-page="chat"><i class="fas fa-headset"></i> Support</button>
      <button class="nav-link" data-page="settings"><i class="fas fa-sliders-h"></i> Settings</button>
    </nav>
    <div class="sidebar-footer"><button class="logout-sidebar" id="logoutSidebarBtn"><i class="fas fa-sign-out-alt"></i> Sign out</button></div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-bar-left"><button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button><div class="page-title-area"><h1 id="pageTitle">Dashboard</h1><div class="breadcrumb" id="breadcrumb">Overview</div></div></div>
      <button class="btn-logout" id="logoutBtn"><i class="fas fa-power-off"></i> Exit</button>
    </div>
    <div id="pageContainer"></div>
  </main>
</div>

<!-- Edit Product Modal -->
<div class="modal-overlay" id="editModalOverlay"><div class="modal"><h3>✏️ Edit product</h3><form id="editProductForm"><input type="hidden" id="editProductId"><div class="form-group"><label>Name</label><input id="editProductName" required></div><div class="form-group"><label>Price (₦)</label><input type="number" id="editProductPrice" required></div><div class="form-group"><label>Stock</label><input type="number" id="editProductStock" min="1"></div><div class="form-group"><label>Category</label><input id="editProductCategory"></div><div class="form-group"><label>Condition</label><select id="editProductCondition"><option>new</option><option>used</option></select></div><div class="form-group"><label>Status</label><select id="editProductStatus"><option>available</option><option>sold</option></select></div><div class="form-group"><label>Description</label><textarea id="editProductDesc" rows="2"></textarea></div><div class="form-group"><label>New image (optional)</label><input type="file" id="editProductImageFile" accept="image/*"></div><div id="editImagePreview"></div><div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;"><button type="button" class="btn-logout" onclick="closeEditModal()">Cancel</button><button type="submit" class="btn-primary">Update</button></div></form></div></div>

<!-- Admin Announcement Modal -->
<div class="modal-overlay" id="announcementModal"><div class="modal"><h3>📢 Update global announcement</h3><textarea id="newAnnouncementText" rows="3" style="width:100%; margin:20px 0;"></textarea><div style="display:flex; gap:12px;"><button class="btn-logout" onclick="closeAnnouncementModal()">Cancel</button><button class="btn-primary" id="saveAnnouncementBtn">Save</button></div></div></div>

<!-- Image preview modal -->
<div class="modal-overlay image-preview-modal" id="imagePreviewModal"><button class="close-image-preview" style="position:absolute; top:20px; right:30px; background:none; border:none; color:white; font-size:34px; cursor:pointer;">&times;</button><div class="modal"><img id="previewImage" src=""></div></div>

<div class="toast-container" id="toastContainer"></div>

<script>
  // ------------------- REAL API INTEGRATION (preserved) -------------------
  const BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:4040' : 'https://gombe-online-market.onrender.com';
  let token = localStorage.getItem('token');
  if (!token) {
    // demo bypass for UI showcase (but real API mode)
    console.warn("No token, using demo fallback but api calls will fail. Real token required.");
  }

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
  }
  function formatCurrency(amt) { return '₦' + Number(amt).toLocaleString('en-NG'); }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}

  async function apiCall(endpoint, options = {}) {
    const url = `${BASE_URL}${endpoint}`;
    const headers = { 'Authorization': `Bearer ${token}` };
    if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
    const res = await fetch(url, { ...options, headers });
    if (!res.ok) {
      let msg = `Request failed (${res.status})`;
      try { const err = await res.json(); msg = err.message || msg; } catch(e) {}
      throw new Error(msg);
    }
    return res.json();
  }

  // announcement
  let currentAnnouncement = "";
  async function loadAnnouncement() {
    try {
      const res = await fetch(`${BASE_URL}/api/announcements/active`, { headers: { 'Authorization': `Bearer ${token}` } });
      if(res.ok) { const data = await res.json(); currentAnnouncement = data.message || "🔥 Gombe Online Market — Trusted by thousands"; }
      else currentAnnouncement = "🔥 Gombe Online Market — Eliminate Jmia & Temi-u";
    } catch(e) { currentAnnouncement = "🔥 Gombe Online Market — Eliminate Jmia & Temi-u"; }
    document.getElementById('announcementText').innerText = currentAnnouncement;
  }
  async function updateAnnouncement(newText) {
    try { await apiCall('/api/announcements/update', { method: 'POST', body: JSON.stringify({ message: newText }) }); currentAnnouncement = newText; document.getElementById('announcementText').innerText = newText; showToast('Announcement updated'); } catch(err) { showToast(err.message, 'error'); }
  }
  function openAnnouncementModal() { document.getElementById('newAnnouncementText').value = currentAnnouncement; document.getElementById('announcementModal').classList.add('show'); }
  function closeAnnouncementModal() { document.getElementById('announcementModal').classList.remove('show'); }
  document.getElementById('editAnnouncementBtn').onclick = openAnnouncementModal;
  document.getElementById('saveAnnouncementBtn').onclick = async () => { const txt = document.getElementById('newAnnouncementText').value.trim(); if(txt) await updateAnnouncement(txt); closeAnnouncementModal(); };

  // image preview
  function openImagePreview(url) { if(url){ document.getElementById('previewImage').src = url; document.getElementById('imagePreviewModal').classList.add('show'); } }
  function closeImagePreview() { document.getElementById('imagePreviewModal').classList.remove('show'); }
  document.getElementById('imagePreviewModal').addEventListener('click', (e) => { if(e.target.classList.contains('modal-overlay')) closeImagePreview(); });
  window.openImagePreview = openImagePreview;

  // ------------------- DASHBOARD PAGES (full API) -------------------
  let productsList = [];

  async function loadOverview() {
    try {
      const statsData = await apiCall('/api/dashboard/stats');
      const { user, stats, recentOrders } = statsData.data;
      document.getElementById('sidebarUserName').innerText = user.name || 'Seller';
      document.getElementById('userAvatarLarge').innerText = (user.name || 'S').charAt(0).toUpperCase();
      document.getElementById('pendingBadge').innerText = stats.pendingOrders ?? 0;
      const container = document.getElementById('pageContainer');
      container.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-shopping-cart"></i></div><div><div class="stat-value">${stats.totalOrders ?? 0}</div><div class="stat-label">Total Orders</div></div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-wallet"></i></div><div><div class="stat-value">${formatCurrency(stats.totalSpent ?? 0)}</div><div class="stat-label">Total Spent</div></div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-hourglass-half"></i></div><div><div class="stat-value">${stats.pendingOrders ?? 0}</div><div class="stat-label">Pending</div></div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-double"></i></div><div><div class="stat-value">${stats.completedOrders ?? 0}</div><div class="stat-label">Completed</div></div></div>
        </div>
        <div class="wallet-card">
          <div><div>💰 Wallet Balance</div><div class="wallet-balance">${formatCurrency(user.walletBalance || 0)}</div><div class="wallet-account" id="copyAccountBtn"><span>${user.accountNumber || 'N/A'}</span> <i class="fas fa-copy"></i></div></div>
          <button class="btn-primary" id="fundWalletBtn"><i class="fas fa-plus-circle"></i> Fund Wallet</button>
        </div>
        <div class="section-card"><div class="section-header"><h3>🌟 Our Services</h3></div><div class="services-grid"><div class="service-card"><i class="fas fa-id-card"></i><h4>NIN Verification</h4></div><div class="service-card"><i class="fas fa-mobile-alt"></i><h4>NIN with Phone</h4></div><div class="service-card"><i class="fas fa-chart-simple"></i><h4>CAC Annual Return</h4></div><div class="service-card"><i class="fas fa-building"></i><h4>SCUML Registration</h4></div></div></div>
        <div class="section-card"><div class="section-header"><h3>📦 Recent Orders</h3><button class="link-btn" id="goToOrdersBtn" style="color:#f97316">View all →</button></div><div id="recentOrdersList"></div></div>
      `;
      const recentDiv = document.getElementById('recentOrdersList');
      if(recentOrders?.length) recentDiv.innerHTML = recentOrders.map(o => `<div class="list-item"><div><strong>${o.order_number}</strong><br><small>${new Date(o.created_at).toLocaleDateString()}</small></div><span class="status-badge status-${o.status}">${o.status}</span><strong>${formatCurrency(o.total_amount)}</strong></div>`).join('');
      else recentDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:32px;">✨ No recent orders</div>';
      document.getElementById('copyAccountBtn')?.addEventListener('click', () => { const acc = document.querySelector('#copyAccountBtn span')?.innerText; if(acc && acc!=='N/A') { navigator.clipboard.writeText(acc); showToast("Account copied"); } });
      document.getElementById('fundWalletBtn')?.addEventListener('click', () => { let amt = prompt("Enter amount (₦)"); if(amt && !isNaN(amt)) showToast(`Fund wallet ${formatCurrency(amt)} (API integration ready)`, 'success'); });
      document.getElementById('goToOrdersBtn')?.addEventListener('click', () => switchPage('orders'));
    } catch(err) { showToast(err.message, 'error'); document.getElementById('pageContainer').innerHTML = '<div class="section-card"><p>⚠️ Unable to load dashboard. Check API connection.</p></div>'; }
  }

  async function loadOrders() {
    try {
      const res = await apiCall('/api/orders/seller');
      const ordersArr = res.data || [];
      const container = document.getElementById('pageContainer');
      container.innerHTML = `<div class="section-card"><div class="section-header"><h3>📋 All Orders</h3></div><div id="ordersFullList"></div></div>`;
      const listDiv = document.getElementById('ordersFullList');
      if(ordersArr.length) listDiv.innerHTML = ordersArr.map(o => `<div class="list-item"><div><strong>#${o.order_number}</strong><div><small>${new Date(o.created_at).toLocaleString()}</small></div></div><span class="status-badge status-${o.status}">${o.status}</span><strong>${formatCurrency(o.total_amount)}</strong></div>`).join('');
      else listDiv.innerHTML = '<div class="empty-state">No orders yet</div>';
    } catch(e) { showToast(e.message,'error'); }
  }

  async function loadTransactions() {
    try {
      const res = await apiCall('/api/transactions');
      const txns = res.data || [];
      const container = document.getElementById('pageContainer');
      container.innerHTML = `<div class="section-card"><div class="section-header"><h3>💰 Transaction History</h3></div><div id="transactionsList"></div></div>`;
      const listDiv = document.getElementById('transactionsList');
      if(txns.length) listDiv.innerHTML = txns.map(t => `<div class="list-item"><div><strong>${t.description}</strong><br><small>${new Date(t.date).toLocaleDateString()}</small></div><span class="${t.type==='credit'?'amount-credit':'amount-debit'}">${t.type==='credit'?'+':'-'} ${formatCurrency(t.amount)}</span></div>`).join('');
      else listDiv.innerHTML = '<div class="empty-state">No transactions</div>';
    } catch(e){ showToast(e.message,'error');}
  }

  async function loadSellPage() {
    const container = document.getElementById('pageContainer');
    container.innerHTML = `<div class="section-card"><h3>🛍️ Add new product</h3><form id="createProductForm"><div class="form-group"><label>Product name *</label><input id="prodName" required></div><div class="form-group"><label>Price (₦) *</label><input type="number" id="prodPrice" required></div><div class="form-group"><label>Stock</label><input id="prodStock" value="1"></div><div class="form-group"><label>Category</label><input id="prodCategory" placeholder="Electronics, Fashion.."></div><div class="form-group"><label>Condition</label><select id="prodCondition"><option>new</option><option>used</option></select></div><div class="form-group"><label>Description</label><textarea id="prodDesc" rows="3"></textarea></div><div class="form-group"><label>Product image</label><input type="file" id="prodImage" accept="image/*"></div><button type="submit" class="btn-primary">Publish product</button></form></div>`;
    document.getElementById('createProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('name', document.getElementById('prodName').value);
      formData.append('price', document.getElementById('prodPrice').value);
      formData.append('stock', document.getElementById('prodStock').value);
      formData.append('category', document.getElementById('prodCategory').value);
      formData.append('condition', document.getElementById('prodCondition').value);
      formData.append('description', document.getElementById('prodDesc').value);
      const imgFile = document.getElementById('prodImage').files[0];
      if(imgFile) formData.append('images', imgFile);
      try {
        await apiCall('/api/products', { method: 'POST', body: formData });
        showToast('✅ Product created!');
        switchPage('my-products');
      } catch(err) { showToast(err.message, 'error'); }
    });
  }

  async function loadMyProductsPage() {
    await refreshMyProducts();
  }
  async function refreshMyProducts() {
    try {
      const res = await apiCall('/api/products/my');
      productsList = res.data || [];
      const container = document.getElementById('pageContainer');
      container.innerHTML = `<div class="section-card"><div class="section-header"><h3>📦 My listings</h3><button class="btn-primary" id="goToSellBtn" style="padding:8px 18px;">+ New Product</button></div><div id="myProductsList"></div></div>`;
      document.getElementById('goToSellBtn').onclick = () => switchPage('sell');
      const listDiv = document.getElementById('myProductsList');
      if(!productsList.length){ listDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:48px;">No products yet. Start selling.</div>'; return; }
      listDiv.innerHTML = productsList.map(p => {
        const imgUrl = p.images?.[0]?.url || (typeof p.images?.[0]==='string' ? p.images[0] : null);
        const thumbHtml = imgUrl ? `<div class="list-item-thumb" onclick="openImagePreview('${imgUrl}')"><img src="${imgUrl}" alt="product"></div>` : `<div class="list-item-thumb"><i class="fas fa-box"></i></div>`;
        return `<div class="list-item" data-id="${p.id}"><div style="display:flex; gap:14px; align-items:center;">${thumbHtml}<div><strong>${escapeHtml(p.name)}</strong><br><small>${p.category||'General'} · Stock: ${p.stock}</small><div><span class="condition-badge" style="background:#f0f0f0;padding:2px 10px;border-radius:20px;">${p.condition||'new'}</span> ${p.sold||p.stock===0 ? '<span style="background:#fee2e2;color:#b91c1c;padding:2px 10px;border-radius:20px;">Sold</span>' : '<span style="background:#dcfce7;padding:2px 10px;border-radius:20px;">Available</span>'}</div></div></div><strong>${formatCurrency(p.price)}</strong><div><button class="action-btn edit" data-action="edit"><i class="fas fa-pen"></i></button> <button class="action-btn delete" data-action="delete"><i class="fas fa-trash"></i></button></div></div>`;
      }).join('');
      listDiv.querySelectorAll('.edit').forEach(btn => { btn.onclick = (e) => { const id = btn.closest('.list-item').dataset.id; openEditModal(id); }; });
      listDiv.querySelectorAll('.delete').forEach(btn => { btn.onclick = async (e) => { if(confirm('Delete product?')){ const id = btn.closest('.list-item').dataset.id; try{ await apiCall(`/api/products/${id}`, { method: 'DELETE' }); showToast('Deleted'); refreshMyProducts(); }catch(err){ showToast(err.message,'error'); } } }; });
    } catch(err) { showToast(err.message, 'error'); }
  }

  function openEditModal(id) {
    const p = productsList.find(x => x.id == id);
    if(!p) return;
    document.getElementById('editProductId').value = p.id;
    document.getElementById('editProductName').value = p.name;
    document.getElementById('editProductPrice').value = p.price;
    document.getElementById('editProductStock').value = p.stock;
    document.getElementById('editProductCategory').value = p.category || '';
    document.getElementById('editProductCondition').value = p.condition || 'new';
    document.getElementById('editProductStatus').value = (p.sold || p.stock===0) ? 'sold' : 'available';
    document.getElementById('editProductDesc').value = p.description || '';
    document.getElementById('editImagePreview').innerHTML = p.images?.[0]?.url ? `<img src="${p.images[0].url}" style="width:70px; border-radius:12px;">` : '';
    document.getElementById('editModalOverlay').classList.add('show');
  }
  function closeEditModal() { document.getElementById('editModalOverlay').classList.remove('show'); }
  document.getElementById('editProductForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editProductId').value;
    const formData = new FormData();
    formData.append('name', document.getElementById('editProductName').value);
    formData.append('price', document.getElementById('editProductPrice').value);
    formData.append('stock', document.getElementById('editProductStock').value);
    formData.append('category', document.getElementById('editProductCategory').value);
    formData.append('condition', document.getElementById('editProductCondition').value);
    formData.append('sold', document.getElementById('editProductStatus').value === 'sold');
    formData.append('description', document.getElementById('editProductDesc').value);
    const newImg = document.getElementById('editProductImageFile').files[0];
    if(newImg) { formData.append('replaceImages', 'true'); formData.append('images', newImg); }
    try {
      await apiCall(`/api/products/${id}`, { method: 'PUT', body: formData });
      showToast('Product updated');
      closeEditModal();
      refreshMyProducts();
    } catch(err) { showToast(err.message, 'error'); }
  });

  async function loadKYC() { document.getElementById('pageContainer').innerHTML = `<div class="section-card"><h3>📄 KYC Verification</h3><p>Upload valid ID to become verified.</p><button class="btn-primary" id="mockKycBtn">Upload document (API ready)</button></div>`; document.getElementById('mockKycBtn')?.addEventListener('click',()=>showToast("KYC submission integrated with /api/kyc")); }
  async function loadChat() { document.getElementById('pageContainer').innerHTML = `<div class="section-card"><h3>💬 Support chat</h3><textarea placeholder="Ask something..." rows="3" style="width:100%; margin:16px 0;"></textarea><button class="btn-primary">Send</button><p class="empty-state">Customer support replies within 2h</p></div>`; }
  async function loadSettings() { document.getElementById('pageContainer').innerHTML = `<div class="section-card"><h3>⚙️ Account preferences</h3><label>Display name</label><input id="settingsName" class="form-group"><button class="btn-primary" id="saveSettings">Save</button></div>`; document.getElementById('saveSettings')?.addEventListener('click',()=>showToast("Settings saved (API)")); }

  const pageMap = { overview: loadOverview, orders: loadOrders, transactions: loadTransactions, sell: loadSellPage, 'my-products': loadMyProductsPage, kyc: loadKYC, chat: loadChat, settings: loadSettings };
  async function switchPage(page) {
    document.querySelectorAll('.nav-link').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
    const titles = { overview:'Dashboard', orders:'My Orders', transactions:'Transactions', sell:'Sell Product', 'my-products':'My Listings', kyc:'KYC Verification', chat:'Support Chat', settings:'Settings' };
    document.getElementById('pageTitle').innerText = titles[page];
    document.getElementById('breadcrumb').innerText = page;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
    await pageMap[page]();
  }
  window.switchPage = switchPage;
  document.querySelectorAll('.nav-link').forEach(btn => btn.addEventListener('click', () => switchPage(btn.dataset.page)));
  document.getElementById('menuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('show'); });
  document.getElementById('sidebarOverlay').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); });
  document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.removeItem('token'); window.location.href = 'login.html'; });
  document.getElementById('logoutSidebarBtn').addEventListener('click', () => { localStorage.removeItem('token'); window.location.href = 'login.html'; });

  loadAnnouncement();
  switchPage('overview');
</script>
</body>
</html>
