<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Gombe Online Market – Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style/register.css">
</head>
<body>  
<div class="screen">
  <!-- Brand header -->
  <div class="brand-area">
    <div class="brand-icon"><i class="fas fa-store"></i></div>
    <div class="brand-name">Gombe<span> Online</span> Market</div>
    <div class="tagline">Buy & sell with confidence in Gombe State</div>
  </div>

  <!-- Registration card -->
  <div class="card">
    <div class="card-header">
      <i class="fas fa-user-plus"></i>
      <h2>Create account</h2>
      <p>Join thousands of local buyers and sellers</p>
    </div>

    <div class="form-group">
      <label><i class="fas fa-user"></i> Full name</label>
      <input type="text" id="fullname" placeholder="e.g., Fatima Bello" autocomplete="name">
    </div>

    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email address</label>
      <input type="email" id="email" placeholder="hello@example.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label><i class="fas fa-phone-alt"></i> Phone number</label>
      <input type="tel" id="phone" placeholder="0801 234 5678" autocomplete="tel">
    </div>

    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="pass-wrapper">
        <input type="password" id="password" placeholder="At least 8 characters">
        <i class="far fa-eye-slash toggle-pass"></i>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-check-circle"></i> Confirm password</label>
      <div class="pass-wrapper">
        <input type="password" id="confirm" placeholder="Repeat password">
        <i class="far fa-eye-slash toggle-pass"></i>
      </div>
    </div>

    <button id="registerBtn" class="btn-primary">
      <span>Create account</span>
      <i class="fas fa-arrow-right"></i>
    </button>

    <div class="or-divider"><span>or</span></div>

    <div class="social-row">
      <button class="social google"><i class="fab fa-google"></i> Google</button>
      <button class="social facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <div class="login-redirect">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <div id="toastMsg" class="toast-message"></div>
  </div>

  <div class="footer-note">🔒 Trusted by 5000+ local users | Secure payments</div>
</div>

<script src="/js/register.js"></script>
</body>
</html>
